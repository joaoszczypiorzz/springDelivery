# CONFIGURACOES GERAIS SPRING e SERVIDOR:

spring.application.name=SpringDelivery
server.port=8081
server.servlet.context-path=/v1/api

# CONFIGURACOES BANCO DE DADOS:

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:banco-teste}
spring.datasource.username=${DB_USERNAME:teste}
spring.datasource.password=${DB_PASSWORD:ABC123}


# CONFIGURACOES HIBERNATE:

spring.jpa.hibernate.ddl-auto=update


# Boa pratica manter open in view desligado
# Isso garante que a aplicacao rode sem sessoes do banco serem abertas automaticamente
# As sessoes so sao abertas via Codigo @Transactional
spring.jpa.open-in-view=false

# CONFIGURACOES SWAGGER:

springdoc.swagger-ui.path=/swagger-ui.html
